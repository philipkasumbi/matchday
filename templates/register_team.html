<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Team | MatchDay</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <main class="simple-auth-container">
    <div class="simple-auth-header">
      <div class="auth-wordmark">MatchDay</div>
      <h2>Register your team</h2>
      <p>Set up your team profile to start booking matches.</p>
    </div>


    <form method="POST" action="{{ url_for('register_team') }}" class="simple-auth-form">
      <div class="form-group">
        <label for="name">Team name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="home_area">Home area</label>
        <input type="text" id="home_area" name="home_area" required>
      </div>

      <div class="form-group">
        <label for="format">Format</label>
        <select id="format" name="format">
          <option value="11-a-side">11-a-side</option>
          <option value="7-a-side">7-a-side</option>
        </select>
      </div>

      <div class="form-group">
        <label for="level">Level</label>
        <select id="level" name="level">
          <option value="Friendly">Friendly</option>
          <option value="League">League</option>
        </select>
      </div>

      <div class="form-group">
        <label for="has_home_pitch">Has home pitch</label>
        <select id="has_home_pitch" name="has_home_pitch">
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>

      <button type="submit" class="btn-simple-auth">Register Team</button>
    </form>
  </main>

</body>
</html>
