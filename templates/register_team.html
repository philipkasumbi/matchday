<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Team</title>
</head>
<body>
<h1>Register your Team</h1>
{% with messages = get_flashed_messages() %}
{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}
{% endwith %}

<form method="POST" action="{{ url_for('register_team')}}">
    <label>Team Name:</label><br>
    <input name="name" type="text" required>
    <br><br>
    <label>Home area:</label><br>
    <input name="home_area" type="text" required>
    <br><br>
    <label>Format:</label>
    <select name="format">
        <option>11-a-side</option>
        <option>7-a-side</option>
    </select>
    <br><br>
    <label>Level:</label>
    <select name="level">
        <option>Friendly</option>
        <option>League</option>
    </select>
    <br><br>
    <label>Has Home Pitch:</label>
    <select name="has_home_pitch">
        <option>Yes</option>
        <option>No</option>
    </select>
    <br><br>

    <button type="submit">submit</button>

</form>
</body>
</html>
